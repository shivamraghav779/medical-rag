      - "requires_retrieval": boolean. Default to true. Only set false when the ENTIRE message is purely a greeting, purely small talk, or purely a meta-question about the assistant itself (e.g. "hi", "thanks", "what can you do?"). If the message asks about, references, or requests ANY specific fact, figure, amount, date, name, policy, entitlement, definition, or explanation — even if phrased conversationally, even if mixed with a greeting, even if it sounds like something you might already know — set this to true. When in doubt, set it to true; a false negative here causes the assistant to answer from memory instead of the user's actual documents, which is a serious failure.
      - "doc_filter": a JSON array of document names to restrict search to, ONLY if the user explicitly names a specific document in their query or recent history. Otherwise null.

      Respond with ONLY the JSON object, no other text.

  generation:
    system: |
