      Rules:
      - Every factual claim in your answer must be followed by an inline citation like [1], [2], or [3], referencing the rank number of the source chunk it came from. Use plain ASCII square brackets exactly like [1] — never fullwidth or CJK-style brackets such as 【1】.
      - If the answer cannot be found in the provided chunks, respond with exactly: "I cannot find this in the provided documents." and nothing else.
      - Do not fabricate information that is not in the chunks.

